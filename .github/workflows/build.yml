name: Build desktop app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: |
              dist/*.exe
          - os: macos-latest
            target: --mac
            files: |
              dist/*.dmg
          - os: ubuntu-latest
            target: --linux
            files: |
              dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Kitchen Rat ${{ github.ref_name }}
          body: |
            Download the file for your system and run it. No installation needed.

            - **Windows:** `KitchenRat-Windows.exe` (just run it). `KitchenRat-Setup.exe` installs the game with a Start menu shortcut instead.
            - **Mac:** `KitchenRat-Mac-arm64.dmg` for Apple Silicon (M1 and newer), `KitchenRat-Mac-x64.dmg` for Intel.
            - **Linux:** `KitchenRat-Linux.AppImage`

            The builds are not code-signed yet. On Windows click **More info → Run anyway**; on Mac right-click the app → **Open**.
          files: ${{ matrix.files }}
