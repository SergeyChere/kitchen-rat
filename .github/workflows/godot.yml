name: Build Godot game

# The Godot version of the game (godot/): free to build on GitHub's own runners, no license needed.
# Runs on published releases (attaches the zips), on changes in godot/ and by hand.
on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['godot/**', '.github/workflows/godot.yml']
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot and export templates
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm godot.zip

      - name: Install export templates
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir" && cd ~/godot
          unzip -q -o templates.tpz -d tmp && mv tmp/templates/* "$dir"/ && rm -rf tmp

      - name: Import assets
        run: ~/godot/godot --headless --path godot --import || true

      - name: Regression tests
        run: |
          for t in bugs rules physics juice sink under; do
            out=$(timeout 180 ~/godot/godot --headless --path godot -- --night=1 --auto --test=$t 2>&1 || true)
            echo "$out"
            if echo "$out" | grep -qE "^FAIL|SCRIPT ERROR|during a physics callback|while flushing queries"; then exit 1; fi
            echo "$out" | grep -q "^PASS" || exit 1
          done

      - name: Export Windows, Linux, Mac
        run: |
          mkdir -p build/godot/windows build/godot/linux build/godot/mac
          ~/godot/godot --headless --path godot --export-release "Windows"
          ~/godot/godot --headless --path godot --export-release "Linux"
          ~/godot/godot --headless --path godot --export-release "Mac"
          mkdir -p build/godot-demo/windows build/godot-demo/linux build/godot-demo/mac
          ~/godot/godot --headless --path godot --export-release "Windows Demo"
          ~/godot/godot --headless --path godot --export-release "Linux Demo"
          ~/godot/godot --headless --path godot --export-release "Mac Demo"
          ls -laR build/godot build/godot-demo

      - name: Pack
        run: |
          cd build/godot
          (cd windows && zip -qr ../../../KitchenRat-Windows.zip .)
          (cd linux && zip -qr ../../../KitchenRat-Linux.zip .)
          cp mac/KitchenRat.zip ../../KitchenRat-Mac.zip
          cd ../godot-demo
          (cd windows && zip -qr ../../../KitchenRat-Demo-Windows.zip .)
          (cd linux && zip -qr ../../../KitchenRat-Demo-Linux.zip .)
          cp mac/KitchenRat-Demo.zip ../../KitchenRat-Demo-Mac.zip
          ls -la ../../*.zip

      # one download per platform (the full game and the demo); the folder is zipped by GitHub
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Windows
          path: build/godot/windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Linux
          path: build/godot/linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Mac
          path: build/godot/mac
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Demo-Windows
          path: build/godot-demo/windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Demo-Linux
          path: build/godot-demo/linux
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Demo-Mac
          path: build/godot-demo/mac
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KitchenRat-*.zip
