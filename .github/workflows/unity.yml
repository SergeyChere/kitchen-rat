
name: Build Unity game

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'unity/**'
      - '.github/workflows/unity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unity Windows
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Unity
        shell: powershell
        run: |
          $editor = "C:\Program Files\Unity\Hub\Editor\6000.3.28f1\Editor\Unity.exe"
          $project = Join-Path $env:GITHUB_WORKSPACE "unity"
          $log = Join-Path $env:RUNNER_TEMP "unity-build.log"

          if (!(Test-Path $editor)) {
            throw "Unity Editor not found"
          }
          if (!(Test-Path (Join-Path $project "Assets"))) {
            throw "Unity project not found: $project"
          }

          $expected = (Get-Content (Join-Path $project "ProjectSettings\ProjectVersion.txt") |
            Select-String 'm_EditorVersion:').ToString().Split(':')[1].Trim()

          if ($expected -ne "6000.3.28f1") {
            throw "Project requires Unity $expected, but runner has 6000.3.28f1"
          }

          & $editor `
            -batchmode `
            -nographics `
            -quit `
            -projectPath $project `
            -buildTarget StandaloneWindows64 `
            -executeMethod KitchenRat.EditorTools.CIBuild.Build `
            -logFile $log

          $exitCode = $LASTEXITCODE

          if (Test-Path $log) {
            Get-Content $log -Tail 150
          }

          if ($exitCode -ne 0) {
            throw "Unity failed: exit code $exitCode"
          }

      - name: Pack build
        shell: powershell
        run: |
          if (!(Test-Path "build")) {
            throw "Build output folder was not found"
          }

          $files = @(Get-ChildItem "build" -Recurse -File)
          if ($files.Count -eq 0) {
            throw "Build output is empty"
          }

          Compress-Archive -Path "build\*" `
            -DestinationPath "KitchenRat-Unity-Windows.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: KitchenRat-Unity-Windows
          path: KitchenRat-Unity-Windows.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: KitchenRat-Unity-Windows.zip
  
